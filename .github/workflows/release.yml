name: Release

# Push a tag like v1.0.0 to build the mod and publish a GitHub release with the jar attached.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Check the tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties"
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: MineMenu ${{ github.ref_name }} (Minecraft 1.21.1)
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            build/libs/minemenu-*.jar
            !build/libs/*-sources.jar
          fail_on_unmatched_files: true
