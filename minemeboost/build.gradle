plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// MineMeBoostXray is MineMenu + MineBoost + MineXray in one jar. It builds straight from the three mods' code
// (no copies), plus the small glue in this folder that adds the tabs and joins them.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../src/main/java', '../mineboost/src/main/java', '../minexray/src/main/java']
        }
    }
    // A compile-only copy of Mod Menu's API: lets the optional Mod Menu button compile without downloading
    // Mod Menu. Not packaged; at runtime the real Mod Menu (if installed) provides these classes.
    modmenuStub {
        compileClasspath += configurations.compileClasspath
    }
}

sourceSets.main.compileClasspath += sourceSets.modmenuStub.output

// Keep the refmap name fixed (the jar's name changed to MineMeBoostXray in 3.6.1): MineMenu's and MineBoost's
// mixin configs point at "minemeboost-refmap.json" (see processResources below).
loom {
    mixin {
        defaultRefmapName = "minemeboost-refmap.json"
    }
}

processResources {
    // Assets (lang files, icons) and MineBoost's mixin config, without the two mods' own fabric.mod.json.
    from('../src/main/resources') { exclude 'fabric.mod.json' }
    from('../mineboost/src/main/resources') { exclude 'fabric.mod.json' }
    from('../minexray/src/main/resources') { exclude 'fabric.mod.json' }
    // Loom only adds the refmap to mixin configs in this project's own resources, so point
    // both mods' mixin configs at this jar's refmap. Without it the mixins fail in a normal install.
    filesMatching(['mineboost.mixins.json', 'minemenu.mixins.json', 'minexray.mixins.json']) {
        filter { String line ->
            line.contains('"required"') ? line + '\n  "refmap": "minemeboost-refmap.json",' : line
        }
    }

    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}


// GameTests: ./gradlew runGametest starts a test server and runs src/gametest (not part of the mod jar).
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    runs {
        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-report.xml"
            runDir = "build/gametest"
            source sourceSets.gametest
        }
    }
}

// In-game tests: ./gradlew runClientTests -Psuite=full|soak|ab|mp|iris [-Pminutes=15] [-PextraMods=dir]
// Starts the real (remapped) jar plus a small test mod (src/clienttest, never shipped) in a production client
// under Xvfb, runs the suite, then checkClientTests fails the build if any check failed.
sourceSets {
    clienttest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

def clientTestSuite = (project.findProperty("suite") ?: "full").toString()
def clientTestRunDir = file("build/clienttest-run-" + clientTestSuite) // one folder per suite, so CI keeps both

tasks.register("clienttestJar", Jar) {
    from sourceSets.clienttest.output
    archiveClassifier = "clienttest-dev"
    destinationDirectory = layout.buildDirectory.dir("clienttest")
}

tasks.register("remapClienttestJar", net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.clienttestJar
    inputFile = tasks.clienttestJar.archiveFile
    archiveClassifier = "clienttest"
    destinationDirectory = layout.buildDirectory.dir("clienttest")
    addNestedDependencies = false
}

tasks.register("runClientTests", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn remapJar, tasks.remapClienttestJar
    mods.from(remapJar.archiveFile)
    mods.from(tasks.remapClienttestJar.archiveFile)
    mods.from(configurations.detachedConfiguration(dependencies.create("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")).setTransitive(false))
    if (project.hasProperty("extraMods")) {
        mods.from(fileTree(project.property("extraMods")) { include "*.jar" })
    }
    jvmArgs.add("-Xmx2G")
    jvmArgs.add("-Dminemeboost.clienttest.suite=" + clientTestSuite)
    jvmArgs.add("-Dminemeboost.clienttest.minutes=" + (project.findProperty("minutes") ?: "15"))
    runDir = clientTestRunDir
    useXVFB = (project.findProperty("xvfb") ?: "true") != "false"
    doFirst {
        // A fresh world and the settings an unattended run needs; plus 3.3-era config files to test migration.
        delete fileTree(clientTestRunDir) { include "saves/**", "screenshots/**", "clienttest/**", "config/**" }
        copy {
            from "src/clienttest/run"
            into clientTestRunDir
        }
    }
    finalizedBy "checkClientTests"
}

tasks.register("checkClientTests") {
    doLast {
        def results = new File(clientTestRunDir, "clienttest/results-${clientTestSuite}.txt")
        if (!results.exists()) {
            throw new GradleException("No results: the game didn't finish the '${clientTestSuite}' suite (see ${clientTestRunDir}/logs/latest.log)")
        }
        def lines = results.readLines()
        def failed = lines.findAll { it.startsWith("FAIL") || it.startsWith("ERROR") }
        println "In-game tests (${clientTestSuite}): ${lines.count { it.startsWith('PASS') }} passed, ${failed.size()} failed"
        failed.each { println "  " + it }
        if (!failed.isEmpty()) {
            throw new GradleException("${failed.size()} in-game check(s) failed, see ${results}")
        }
    }
}
